<!doctype html>
<html lang="rw">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B3C5D" />
    <meta
      name="description"
      content="ZeroMalaria — CHW malaria triage and referral. Decision support tool. Not a replacement for clinical judgment."
    />
    <title>ZeroMalaria</title>
  </head>
  <body class="bg-app text-ink">
    <div id="root">
      <style>
        @keyframes zm-boot-dot {
          0%, 100% { opacity: .35; transform: translateY(0) scale(.85); }
          50% { opacity: 1; transform: translateY(-7px) scale(1.1); }
        }
        @media (prefers-reduced-motion: reduce) {
          .zm-boot-dot { animation: none !important; opacity: .65; }
        }
      </style>
      <div role="status" aria-label="Birimo gutunganywa" style="position:fixed;inset:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;font-family:Inter,system-ui,sans-serif;background:#F6F8FB">
        <div style="display:flex;flex-direction:column;align-items:center;text-align:center;transform:translateY(-16px)">
          <svg width="88" height="88" viewBox="0 0 64 64" fill="none" aria-hidden="true" style="display:block;filter:drop-shadow(0 14px 24px rgba(6,36,58,.18))">
            <defs><linearGradient id="boot-logo-gradient" x1="0" y1="0" x2="64" y2="64"><stop stop-color="#125278"/><stop offset="1" stop-color="#06243a"/></linearGradient></defs>
            <rect width="64" height="64" rx="18" fill="url(#boot-logo-gradient)"/>
            <rect x=".5" y=".5" width="63" height="63" rx="17.5" stroke="white" stroke-opacity=".18"/>
            <circle cx="32" cy="32" r="17" stroke="#2bb3a6" stroke-width="4.5"/>
            <path d="M21 34.5c6 8 16 8 22 0" stroke="#f5a524" stroke-width="4.5" stroke-linecap="round"/>
          </svg>
          <strong style="display:block;margin-top:16px;font-size:24px;line-height:1.2;letter-spacing:-.03em"><span style="color:#125278">Zero</span><span style="color:#14807a">Malaria</span></strong>
          <div aria-hidden="true" style="height:20px;margin-top:24px;display:flex;align-items:center;justify-content:center;gap:8px">
            <span class="zm-boot-dot" style="width:10px;height:10px;border-radius:999px;background:#14807a;animation:zm-boot-dot .9s ease-in-out infinite"></span>
            <span class="zm-boot-dot" style="width:10px;height:10px;border-radius:999px;background:#14807a;animation:zm-boot-dot .9s ease-in-out .14s infinite"></span>
            <span class="zm-boot-dot" style="width:10px;height:10px;border-radius:999px;background:#14807a;animation:zm-boot-dot .9s ease-in-out .28s infinite"></span>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
